# Blueprint для Render.com: веб-сервис (FastAPI + клиент) и бесплатная PostgreSQL.
# Render Dashboard → New → Blueprint → выбрать репозиторий — всё создастся автоматически.
services:
  - type: web
    name: the-wall
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: the-wall-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: the-wall-db
    plan: free
    region: frankfurt
    databaseName: thewall
    user: thewall
    ipAllowList: []  # доступ только из внутренней сети Render
